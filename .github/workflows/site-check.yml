name: Site check (temporary)
on:
  push:
    branches: [claude/intelligent-allen-iw2dgp]
    paths: [.github/workflows/site-check.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          for t in A AAAA CNAME CAA NS; do echo "== svedasbau.de $t"; dig +short svedasbau.de $t; done
          for t in A AAAA CNAME; do echo "== www.svedasbau.de $t"; dig +short www.svedasbau.de $t; done
      - name: HTTP / HTTPS
        run: |
          for u in http://svedasbau.de/ https://svedasbau.de/ http://www.svedasbau.de/ https://www.svedasbau.de/; do
            echo "== $u"; curl -sS -o /dev/null -m 20 -w "code=%{http_code} redirect=%{redirect_url} ssl_verify=%{ssl_verify_result}\n" "$u" || true
          done
      - name: Certificate
        run: |
          for h in svedasbau.de www.svedasbau.de; do
            echo "== $h"; echo | timeout 20 openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || echo "no certificate"
          done
      - name: Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages || true
          gh api repos/${{ github.repository }}/pages/health || true
