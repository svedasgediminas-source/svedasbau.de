name: Nova IPTV Android build

on:
  push:
    paths:
      - "nova-iptv/**"
      - ".github/workflows/nova-iptv-android.yml"
  workflow_dispatch:

concurrency:
  group: nova-iptv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nova-iptv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests (parsers, Xtream, EPG)
        run: set -o pipefail; ./gradlew -PjvmOnly=true test --continue 2>&1 | tee -a build.log

      - name: Android unit tests
        run: set -o pipefail; ./gradlew testDebugUnitTest --continue 2>&1 | tee -a build.log

      - name: Assemble debug and release APKs
        run: set -o pipefail; ./gradlew assembleDebug assembleRelease --continue 2>&1 | tee -a build.log

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Error summary
        if: failure()
        run: |
          echo "===== ERROR SUMMARY ====="
          grep -E '^e: |^w: .*(unresolved|deprecated)|error:|What went wrong|FAILED|Unresolved reference|Cannot find|Could not resolve' build.log | grep -v '^w: ' | sort -u | head -150 || true
          grep -A8 'What went wrong' build.log | head -80 || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-iptv-apk
          path: nova-iptv/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-iptv-reports
          path: |
            nova-iptv/**/build/reports/**
            nova-iptv/**/build/test-results/**
          if-no-files-found: ignore
