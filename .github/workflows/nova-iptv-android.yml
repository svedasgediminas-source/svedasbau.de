name: Nova IPTV Android build

on:
  push:
    paths:
      - "nova-iptv/**"
      - ".github/workflows/nova-iptv-android.yml"
  workflow_dispatch:

concurrency:
  group: nova-iptv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nova-iptv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests (parsers, Xtream, EPG)
        run: set -o pipefail; ./gradlew -PjvmOnly=true test --continue 2>&1 | tee -a build.log

      - name: Android unit tests
        run: set -o pipefail; ./gradlew testDebugUnitTest --continue 2>&1 | tee -a build.log

      - name: Assemble debug and release APKs
        if: ${{ !cancelled() }}
        run: set -o pipefail; ./gradlew assembleDebug assembleRelease --continue 2>&1 | tee -a build.log

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug 2>&1 | tail -5 || true
          echo "===== LINT ERRORS ====="
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/reports/lint-results-debug.xml'):
              for i in ET.parse(f).getroot().iter('issue'):
                  if i.get('severity') in ('Error', 'Fatal'):
                      loc = i.find('location')
                      where = f"{loc.get('file','?').split('nova-iptv/')[-1]}:{loc.get('line','?')}" if loc is not None else '?'
                      print(f"{i.get('id')}: {where}: {i.get('message')}")
          PY
        continue-on-error: true

      - name: Error summary
        if: failure()
        run: |
          echo "===== KOTLIN ERRORS ====="
          grep -E '^e: ' build.log | sed -E 's#file:///home/runner/work/svedasbau.de/svedasbau.de/nova-iptv/##' | sort -u | head -200 || true
          echo "===== FAILED TASKS ====="
          grep -E '^> Task .* FAILED' build.log | sort -u || true
          echo "===== FIRST LINES OF EACH FAILURE ====="
          grep -A4 'What went wrong' build.log | grep -vE '^\s*$|Try:' | head -60 || true

      - name: Test summary
        if: always()
        run: |
          python3 ci/test_summary.py "Unit tests" '**/build/test-results/**/*.xml'
          echo "===== APKs ====="
          find app/build/outputs/apk -name '*.apk' -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Publish APK to the "nova-iptv-latest" release (direct download link)
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          [ -s "$apk" ] || { echo "no release APK"; exit 0; }
          cp "$apk" nova-iptv.apk
          tag=nova-iptv-latest
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "${{ github.sha }}" \
              --title "Nova IPTV – latest test build" \
              --notes "Test build for sideloading on Android TV / Google TV. Direct link: https://github.com/${{ github.repository }}/releases/download/$tag/nova-iptv.apk . The app contains no channels; add your own playlist."
          fi
          gh release upload "$tag" nova-iptv.apk --clobber
          echo "APK: https://github.com/${{ github.repository }}/releases/download/$tag/nova-iptv.apk"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-iptv-apk
          path: nova-iptv/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-iptv-reports
          path: |
            nova-iptv/**/build/reports/**
            nova-iptv/**/build/test-results/**
          if-no-files-found: ignore

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: nova-iptv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: set -o pipefail; ./gradlew assembleDebug :app:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest --continue 2>&1 | tee -a build.log

      - name: Android TV emulator (instrumented tests + smoke test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: nova-iptv
          script: bash ci/emulator-run.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-iptv-tv-screenshots
          path: nova-iptv/build/emulator/screens/*.png
          if-no-files-found: warn

      - name: Upload emulator logs and instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-iptv-emulator-reports
          path: |
            nova-iptv/build/emulator/**
            nova-iptv/**/build/outputs/androidTest-results/**
            nova-iptv/**/build/reports/androidTests/**
          if-no-files-found: ignore

      - name: Commit screenshots to the branch
        if: ${{ always() && github.event_name == 'push' }}
        working-directory: nova-iptv
        run: |
          shots=build/emulator/screens
          [ -d "$shots" ] || exit 0
          mkdir -p docs/screenshots
          for f in 01-launch-onboarding 10-demo-home 11-demo-livetv 12-demo-player 13-demo-guide 14-demo-settings; do
            [ -s "$shots/$f.png" ] && cp "$shots/$f.png" docs/screenshots/
          done
          git config user.name "nova-ci"
          git config user.email "nova-ci@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "CI: Android TV emulator screenshots (run ${{ github.run_id }}) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done

      - name: Emulator summary
        if: always()
        run: |
          echo "===== BUILD ERRORS ====="
          grep -E '^e: ' build.log 2>/dev/null | sed -E 's#file:///home/runner/work/svedasbau.de/svedasbau.de/nova-iptv/##' | sort -u | head -40 || true
          grep -E '^e: ' build/emulator/connected.log 2>/dev/null | sed -E 's#file:///home/runner/work/svedasbau.de/svedasbau.de/nova-iptv/##' | sort -u | head -40 || true
          echo "===== DEVICE ====="
          echo "sdk=$(cat build/emulator/device-sdk.txt 2>/dev/null) characteristics=$(cat build/emulator/device-characteristics.txt 2>/dev/null) $(cat build/emulator/device-leanback.txt 2>/dev/null | tr '\n' ' ')"
          echo "===== CONNECTED GRADLE (exit $(cat build/emulator/connected.exit 2>/dev/null)) ====="
          grep -E 'FAILED|Tests on|What went wrong|No tests|BUILD ' build/emulator/connected.log 2>/dev/null | head -30 || true
          grep -A3 'What went wrong' build/emulator/connected.log 2>/dev/null | head -20 || true
          echo "===== QA MEASUREMENTS ====="
          grep -h 'NovaQA' build/emulator/logcat-instrumented.txt 2>/dev/null | sed -E 's/^.*NovaQA *: //' | head -90 || true
          echo "===== SMOKE ====="
          cat build/emulator/smoke.txt 2>/dev/null || true
          ls build/emulator/screens 2>/dev/null | tr '\n' ' '; echo
          echo "===== CRASHES ====="
          cat build/emulator/crash-status.txt 2>/dev/null || echo "crash scan did not run"
          head -80 build/emulator/crashes.txt 2>/dev/null || true
          python3 ci/test_summary.py "Instrumented tests" '**/build/outputs/androidTest-results/**/*.xml'
